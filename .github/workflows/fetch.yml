name: fetch-market-data

on:
  schedule:
    # GitHub 排程是盡力而為（11/06–11/09 曾延遲 3–7 小時後整個停擺），所以每個時段都排一個備援，
    # 重跑只會覆蓋成同樣的資料。主要觸發改由外部排程 workflow_dispatch 負責。
    # 台股收盤：台北 20:43（12:43 UTC），備援 21:47（13:47 UTC），週一至五
    - cron: "43 12 * * 1-5"
    - cron: "47 13 * * 1-5"
    # 晨間：台北 05:43（21:43 UTC 前一日），備援 06:17（22:17 UTC），週二至六台北
    - cron: "43 21 * * 1-5"
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "tw, us, or all"
        default: "all"

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # always start from the newest main, not the commit the run was triggered on
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 12 * * 1-5" ] || [ "${{ github.event.schedule }}" = "47 13 * * 1-5" ]; then
            echo "mode=tw" >> "$GITHUB_OUTPUT"
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch.py "${{ steps.mode.outputs.mode }}"
      - name: Update history series (last 7 days, fills only missing fields)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/history.py --recent 7
      - name: Commit data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: ${{ steps.mode.outputs.mode }} $(TZ=Asia/Taipei date +%F_%H%M)"
          # if main moved meanwhile, replay on top and keep this run's data files on conflict
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
