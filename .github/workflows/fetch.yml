name: fetch-market-data

on:
  schedule:
    # Taiwan close snapshot: 20:40 Taipei (12:40 UTC), Mon-Fri. TAIFEX/TWSE open data are complete by then.
    - cron: "40 12 * * 1-5"
    # Morning snapshot: 05:40 Taipei (21:40 UTC previous day), Mon-Fri UTC = Tue-Sat Taipei. Runs tw + us.
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "tw, us, or all"
        default: "all"

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # always start from the newest main, not the commit the run was triggered on
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 12 * * 1-5" ]; then
            echo "mode=tw" >> "$GITHUB_OUTPUT"
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch.py "${{ steps.mode.outputs.mode }}"
      - name: Commit data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: ${{ steps.mode.outputs.mode }} $(TZ=Asia/Taipei date +%F_%H%M)"
          # if main moved meanwhile, replay on top and keep this run's data files on conflict
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
