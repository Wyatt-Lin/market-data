name: intraday
on:
  schedule:
    # GitHub 排程是盡力而為：整點與 :00/:05 附近最容易延遲或被丟掉，所以用奇數分鐘。
    # 台股盤中 台北 09:07–13:52（UTC 01:07–05:52），每 15 分鐘
    - cron: "7-52/15 1-5 * * 1-5"
    # 台指期夜盤 台北 15:07–21:52（UTC 07:07–13:52），每 15 分鐘；22:00 後由美股時段那一組涵蓋到 05:52
    - cron: "7-52/15 7-13 * * 1-5"
    # 美股盤中 台北 22:37–05:22（UTC 14:37–21:22），每 15 分鐘
    - cron: "7-52/15 14-21 * * 1-5"
  # 外部排程（cron-job.org）會用 workflow_dispatch 準時觸發，GitHub 排程變成備援
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-push
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/intraday.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json
          git diff --cached --quiet && exit 0
          git commit -m "intraday snapshot $(TZ=Asia/Taipei date +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done
          exit 1
